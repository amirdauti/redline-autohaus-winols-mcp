[package]
name = "winols-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local MCP server for WinOLS map definitions with an OLS530 Lua bridge"
license = "MIT"
repository = "https://github.com/amirdauti/redline-autohaus-winols-mcp"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
rmcp = { version = "3.3", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "fs", "sync", "time", "signal", "process"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
mlua = { version = "0.11", features = ["lua53", "vendored"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

